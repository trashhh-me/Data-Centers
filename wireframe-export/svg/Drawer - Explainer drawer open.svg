<text x="1377.00" y="233.80" font-family="Poppins" font-size="36.00" font-weight="700" fill="rgb(58,53,72)" xml:space="preserve">What is a server?</text>
<text x="1377.00" y="292.39" font-family="Poppins" font-size="24.00" font-weight="400" fill="rgb(58,53,72)" xml:space="preserve">A computer built to run all day and</text>
<text x="1377.00" y="327.18" font-family="Poppins" font-size="24.00" font-weight="400" fill="rgb(58,53,72)" xml:space="preserve">answer requests from many people at</text>
<text x="1377.00" y="361.98" font-family="Poppins" font-size="24.00" font-weight="400" fill="rgb(58,53,72)" xml:space="preserve">once. A data center holds thousands of</text>
<text x="1377.00" y="396.78" font-family="Poppins" font-size="24.00" font-weight="400" fill="rgb(58,53,72)" xml:space="preserve">them in tall racks.</text>
<text x="1377.00" y="456.77" font-family="Poppins" font-size="28.00" font-weight="700" fill="rgb(58,53,72)" xml:space="preserve">Where does the rest go?</text>
<text x="1377.00" y="513.17" font-family="Poppins" font-size="24.00" font-weight="400" fill="rgb(58,53,72)" xml:space="preserve">Mostly to cooling, plus storage, network</text>
<text x="1377.00" y="547.97" font-family="Poppins" font-size="24.00" font-weight="400" fill="rgb(58,53,72)" xml:space="preserve">equipment and power conversion.</text>
<rect x="1377.00" y="581.56" width="487.00" height="1.50" fill="rgb(233,229,221)"/>
<text x="1377.00" y="629.06" font-family="Poppins" font-size="20.00" font-weight="400" fill="rgb(122,114,136)" xml:space="preserve">International Energy Agency (2025). Energy and</text>
<text x="1377.00" y="659.06" font-family="Poppins" font-size="20.00" font-weight="400" fill="rgb(122,114,136)" xml:space="preserve">AI. IEA, Paris.</text>
</svg>
